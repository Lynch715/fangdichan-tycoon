<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1419">
  <title>房地产大亨</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand"><span class="logo">房地产大亨</span><span class="muted small company">山城置业</span></div>
      <div class="clock">
        <span id="date"></span>
        <div class="turn-ctl" role="group" aria-label="回合">
          <button class="turn-label" data-act="briefing" id="turn-label" aria-label="查看回合简报">第 1 回合</button>
          <button class="end-turn" data-act="end-turn" id="end-turn">结束回合<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2l6 5-6 5zM10 2h2v10h-2z" fill="currentColor"/></svg></button>
        </div>
      </div>
      <div class="top-right">
        <span class="desktop-only muted small">市场情绪 <b id="sentiment" class="ok-text"></b></span>
        <span class="mobile-status"><b id="m-cash"></b><span id="m-lights" class="lights"></span><span id="m-tier"></span><b id="m-rating"></b><button class="save-btn" data-act="saves" aria-label="存档与读档"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-2Zm2 0v5h8V3M7 21v-7h10v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>存档</span></button></span>
        <button class="inbox-btn desktop-only" data-act="inbox" aria-label="经营消息"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.3 15.4A1 1 0 0 0 5.2 17h13.6a1 1 0 0 0 .9-1.6L18 12.6V9a6 6 0 0 0-6-6Zm-2.5 15a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>消息</span><span class="badge" id="inbox-badge"></span></button>
        <button class="inbox-btn desktop-only" data-act="saves" aria-label="存档与读档"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-2Zm2 0v5h8V3M7 21v-7h10v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>存档</span></button>
        <button class="ghost desktop-only" data-act="restart">重新开始</button>
      </div>
    </header>

    <aside class="panel left" aria-label="财务">
      <div class="sheet-head"><span class="sheet-grip" aria-hidden="true"></span><b class="sheet-title">财务</b><button class="sheet-close" data-act="close-sheet" aria-label="收起面板">收起</button></div>
      <div id="turn"></div>
      <div id="session"></div>
      <div id="milestones"></div>
      <div id="finance"></div>
      <span id="storage-status" class="small muted" role="status"></span>
      <span id="offline-status" class="small muted" role="status">离线缓存准备中</span>
      <button class="ghost" data-act="saves">存档与读档</button>
      <button class="ghost" data-act="reports">经营报表与复盘</button>
      <button class="ghost" data-act="toggle-briefing" id="briefing-toggle">每回合结束弹出简报：开</button>
      <input id="import-save" type="file" accept="application/json,.json" hidden>
      <button class="ghost mobile-only" data-act="restart">重新开始</button>
    </aside>

    <main class="map">
      <div id="map-canvas"></div>
      <div class="region-switch" role="group" aria-label="地图区域"><button data-map="city" class="on">重庆主城</button><button data-map="outer">外围主城</button><button data-map="suburb">远郊区县</button></div>
      <div id="toast" class="toast" role="status" data-act="toast"></div>
      <div id="cheers" class="cheers" aria-live="polite"></div>
      <button id="guide" class="guide" data-act="guide" hidden></button>
      <div class="map-controls">
        <button data-act="zoom-in" aria-label="放大">+</button>
        <button data-act="zoom-out" aria-label="缩小">−</button>
        <button data-act="fit" aria-label="重置视角">⟲</button>
      </div>
      <div class="legend"><span><i class="sw mine"></i>我的项目</span><span><i class="sw parcel"></i>待拍地块</span><span id="urban" class="muted">示意地图</span></div>
    </main>

    <aside class="panel right">
      <div class="sheet-head"><span class="sheet-grip" aria-hidden="true"></span><b class="sheet-title"><span class="when-projects">项目</span><span class="when-land">拍地</span></b><button class="sheet-close" data-act="close-sheet" aria-label="收起面板">收起</button></div>
      <section class="projects-wrap">
        <div class="row between"><h2>项目看板</h2></div>
        <div id="projects" class="cards"></div>
      </section>
      <section class="auctions-wrap">
        <div class="row between"><h2>本季土地拍卖</h2><span id="auction-count" class="muted small"></span></div>
        <div id="auctions" class="cards"></div>
        <div id="districts" class="cards"></div>
      </section>
    </aside>

    <aside class="panel inbox" aria-label="经营消息">
      <div class="sheet-head"><span class="sheet-grip" aria-hidden="true"></span><b class="sheet-title">经营消息</b><button class="sheet-close" data-act="close-sheet" aria-label="关闭消息">关闭</button></div>
      <div id="inbox-list" class="msgs"></div>
    </aside>

    <footer id="news" class="news-bar" data-act="inbox" title="点击查看全部经营消息"></footer>

    <nav class="tabs" aria-label="主导航">
      <button data-tab="map">地图</button>
      <button data-tab="finance">财务</button>
      <button data-tab="projects">项目</button>
      <button data-tab="land">拍地</button>
      <button data-tab="inbox">消息<span class="badge" id="tab-badge"></span></button>
    </nav>
  </div>
  <dialog id="acquisition-dialog" class="acquisition-dialog" aria-labelledby="acquisition-title"></dialog>
  <dialog id="capital-dialog" class="acquisition-dialog" aria-labelledby="capital-title"></dialog>
  <dialog id="setup-dialog" class="acquisition-dialog setup-dialog" aria-labelledby="setup-title"></dialog>
  <dialog id="reports-dialog" aria-labelledby="report-title"></dialog>
  <dialog id="saves-dialog" class="acquisition-dialog saves-dialog" aria-labelledby="saves-title"></dialog>
  <dialog id="achievements-dialog" class="acquisition-dialog saves-dialog achievements-dialog" aria-labelledby="achievements-title"></dialog>
  <dialog id="turn-dialog" class="acquisition-dialog saves-dialog turn-dialog" aria-labelledby="turn-title"></dialog>
  <dialog id="staff-dialog" class="acquisition-dialog saves-dialog staff-dialog" aria-labelledby="staff-title"></dialog>
  <dialog id="career-dialog" class="acquisition-dialog saves-dialog achievements-dialog" aria-labelledby="career-title"></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
