<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A4 施工地图验收</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f1419;color:#e8eaed;font:14px system-ui,sans-serif}header{min-height:64px;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#182028}h1{font-size:17px;margin:0}select,button{color:inherit;background:#293640;border:1px solid #64757d;border-radius:5px;padding:7px}#map{height:calc(100dvh - 84px);min-height:480px;touch-action:none}#status{color:#f3b96a}footer{font-size:12px;color:#a4b3bd;padding:3px 12px}@media(max-width:600px){header{min-height:105px;gap:8px}#map{height:calc(100dvh - 130px);min-height:420px}h1{width:100%}}
</style><header><h1>A4 施工地图验收</h1><label>产品 <select id="line"><option value="tower">高层住宅</option><option value="garden">洋房</option></select></label><label>阶段 <select id="stage"><option value="pit">基坑</option><option value="ground">正负零</option><option value="frame" selected>主体施工</option><option value="topped">封顶</option><option value="finished">成品</option></select></label><button id="fit">重置视角</button><span id="status">加载中…</span></header><div id="map"></div><footer>读取种子与指令日志，使用正式存档回放和地图渲染器。仅为本地验收页。</footer><script type="module">
import{IsoMap}from'/src/render/isoMap.ts';import{restore,validateSave}from'/src/save.ts';
const $=s=>document.querySelector(s),map=new IsoMap($('#map'),()=>{});await map.init();let request=0;
async function show(){const current=++request;try{const data=await fetch('./a4-'+$('#line').value+'-'+$('#stage').value+'.json').then(r=>r.json()),save=validateSave(data);if(!save)throw Error('存档校验失败');const state=restore(save);if(current!==request)return;map.update(state,null);const p=state.projects[0];$('#status').textContent=p.name+' · 第'+state.day+'天 · 进度'+(p.progress*100).toFixed(1)+'%';}catch(e){$('#status').textContent=e.message;}}
$('#line').addEventListener('change',show);$('#stage').addEventListener('change',show);$('#fit').addEventListener('click',()=>map.fit());show();
</script></html>
