<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B9 地块与片区验收</title><link rel="stylesheet" href="/src/style.css"><style>
body{height:100dvh;display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--panel)}header select{flex:0 1 240px;min-width:150px;max-width:100%}h1{font-size:17px;margin:0}#status,#notice{padding:8px;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 440px;flex:1;min-height:0}#map{overflow:hidden;touch-action:none}#panels{overflow:auto;padding:12px}#land,#projects{display:flex;flex-direction:column;gap:12px}body[data-view=land] #projects,body[data-view=projects] #land{display:none}@media(max-width:600px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:160px 1fr}#panels{padding:8px}header h1{width:100%}}
</style><body data-view="land"><header><h1>B9 地块与片区验收</h1><select id="scene" aria-label="场景"><option value="project">外围主城 · 陡坡山景</option><option value="sales">山景项目 · 在售</option><option value="old">旧v10原项目</option></select><select id="region" aria-label="地图"><option value="outer">外围主城</option><option value="city">核心主城</option><option value="suburb">远郊区县</option></select><button id="month">推进一月</button><button id="sales">推进至第330日</button><button data-view="land">拍地</button><button data-view="projects">项目</button><button id="export">导出测试档</button><button id="reload">重载测试档</button></header><div id="status"></div><div id="notice" role="status"></div><main><div id="map"></div><div id="panels"><div id="districts"></div><div id="land"></div><div id="projects"></div><p id="evidence" class="small muted"></p></div></main><script type="module">
import{Game}from'/src/game.ts';import{AuctionController}from'/src/ui/auctionController.ts';import{IsoMap}from'/src/render/isoMap.ts';import{headerDate,projectsPanel,auctionsPanel}from'/src/ui/panels.ts';import{districtsPanel}from'/src/ui/regions.ts';
if(location.hostname!=='127.0.0.1'||location.port!=='5182')throw Error('仅供独立测试源5182使用');const $=s=>document.querySelector(s),scene=new URLSearchParams(location.search).get('scene')??'project';if(!['project','sales','old'].includes(scene))throw Error('未知场景');$('#scene').value=scene;$('#scene').onchange=()=>location.search=new URLSearchParams({scene:$('#scene').value});const game=new Game(),raw=scene==='sales'?await fetch('./b9-project-330.json').then(r=>r.text()):scene==='old'?await fetch('./b8-day-240.json').then(r=>r.text()):JSON.stringify({version:11,seed:10,day:0,log:[]}),result=game.importSave(raw);if(!result.ok)throw Error(result.error);let mapId=scene==='old'?'city':'outer';$('#region').value=mapId;
const controller=new AuctionController(game,document,r=>$('#notice').textContent=r.ok?'报价已提交':r.error),map=new IsoMap($('#map'),()=>{});await map.init();
function show(){const s=game.state;$('#status').textContent=`${headerDate(game.config,s)} · 第${s.day}日 · v${s.version} · 现金 ${(s.cash/10000).toFixed(6)}亿 · 指令 ${game.log.length}条`;map.update(s,null,mapId);$('#districts').innerHTML=districtsPanel(game.config,s,mapId);$('#land').innerHTML=auctionsPanel(game.config,{...s,auctions:s.auctions.filter(a=>game.config.districts.find(d=>d.id===a.districtId).mapId===mapId)},null,controller.bids,controller.amenities);$('#projects').innerHTML=projectsPanel(game.config,s,null);$('#evidence').textContent=s.projects.map(p=>`${p.id} 建安 ${p.buildCost.toFixed(4)}万元 · 已付 ${p.buildSpent.toFixed(4)}万元 · 工程 ${(p.progress*100).toFixed(6)}% · 售出 ${p.soldArea.toFixed(6)}㎡ · ${p.attributes?'新地块条件':'保留旧地块条件'}`).join('；');}
game.onChange(show);$('#region').onchange=()=>{mapId=$('#region').value;show();};document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>document.body.dataset.view=b.dataset.view);const advance=day=>{let frames=0;while(game.state.day<day&&game.state.status!=='bankrupt'&&frames++<5000){game.setSpeed(4);game.frame(250);game.frame(250);}game.setSpeed(0);};$('#month').onclick=()=>advance(game.state.day+30);$('#sales').onclick=()=>advance(330);$('#projects').onclick=e=>{const b=e.target.closest('[data-act="start-project"]');if(b){const r=game.issue({type:'startProject',projectId:b.dataset.id,contractor:b.dataset.contractor});$('#notice').textContent=r.ok?'总包已选定，项目开工':r.error;}};$('#reload').onclick=()=>{const result=game.importSave(game.exportSave());$('#notice').textContent=result.ok?'种子与指令重载完成':result.error;};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([game.exportSave()],{type:'application/json'}));a.download='b9-'+scene+'-save.json';a.click();URL.revokeObjectURL(a.href);};show();
</script></body></html>
