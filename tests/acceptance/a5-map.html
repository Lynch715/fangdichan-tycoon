<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A5 成品与城市地图验收</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1419;color:#e8eaed;font:14px system-ui}header{padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-height:64px;background:#182028}h1{margin:0;font-size:17px}select,button{padding:7px;background:#293640;border:1px solid #64757d;border-radius:5px;color:inherit}#map{height:calc(100dvh - 84px);touch-action:none}#status{color:#efb56b}footer{padding:3px 10px;font-size:12px;color:#a4b3bd}@media(max-width:600px){header{min-height:110px}h1{width:100%}#map{height:calc(100dvh - 130px)}}</style><header><h1>A5 成品与城市地图验收</h1><label>产品 <select id="product"><option value="tower">高层住宅</option><option value="garden">洋房</option><option value="villa">别墅</option><option value="commercial">商业裙楼</option></select></label><label>变体 <select id="variant"><option>a</option><option>b</option><option>c</option></select></label><button id="fit">重置视角</button><button id="out">缩小</button><span id="status">加载中</span></header><div id="map"></div><footer>合法存档回放后经setAppearance指令选择外观，使用正式地图渲染器；仅供本地验收。</footer><script type="module">
import{IsoMap}from'/src/render/isoMap.ts';import{validateSave,restore}from'/src/save.ts';import{applyCommand}from'/src/sim/index.ts';
const $=s=>document.querySelector(s),map=new IsoMap($('#map'),()=>{});await map.init();const fixture=await fetch('./a4-garden-finished.json').then(r=>r.json());
function show(){const state=restore(validateSave(fixture)),p=state.projects[0],product=$('#product').value,variant=$('#variant').value;const r=applyCommand(state,{type:'setAppearance',projectId:p.id,product,variant});if(!r.ok)throw Error(r.error);map.update(state,p.id);$('#status').textContent=product+' / '+variant+' · 第'+state.day+'天';}
$('#product').addEventListener('change',show);$('#variant').addEventListener('change',show);$('#fit').addEventListener('click',()=>map.fit());$('#out').addEventListener('click',()=>map.zoom(.8));show();
</script></html>
