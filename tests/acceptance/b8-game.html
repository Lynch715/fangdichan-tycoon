<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B8 公司债与提前到期验收</title><link rel="stylesheet" href="/src/style.css"><style>
body{min-height:100dvh;height:auto;overflow:auto}header{padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}h1{font-size:18px;margin:0}#status,#notice{padding:8px 12px}main{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);max-width:1200px;margin:auto;gap:20px;padding:12px}#finance{padding:14px;display:flex;flex-direction:column;gap:18px;background:var(--panel)}#evidence{min-width:0;overflow-wrap:anywhere}#evidence table{width:100%;font-size:13px}#evidence td,#evidence th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}@media(max-width:650px){main{display:flex;flex-direction:column;padding:8px}header h1{width:100%}#finance{padding:10px}}
</style><body><header><h1>B8 公司债与提前到期验收</h1><select id="scene" aria-label="场景"><option value="issue">AA公司债发行</option><option value="239">降级前一天</option><option value="240">C级提前到期</option><option value="270">提前本金已支付</option><option value="old">旧v9合同</option></select><button id="day">推进一天</button><button id="month">推进一月</button><button id="export">导出测试档</button><button id="reload">重载测试档</button></header><div id="status"></div><div id="notice" role="status"></div><main><div id="finance"></div><section id="evidence"></section></main><script type="module">
import{Game}from'/src/game.ts';import{financePanel,headerDate}from'/src/ui/panels.ts';import{issueBondFromForm}from'/src/ui/bondController.ts';import{esc}from'/src/ui/format.ts';
if(location.hostname!=='127.0.0.1'||location.port!=='5182')throw Error('仅供5182独立测试源使用');const $=s=>document.querySelector(s),scene=new URLSearchParams(location.search).get('scene')??'issue';if(!['issue','239','240','270','old'].includes(scene))throw Error('未知场景');$('#scene').value=scene;$('#scene').onchange=()=>location.search=new URLSearchParams({scene:$('#scene').value});const game=new Game(),raw=['239','240','270'].includes(scene)?await fetch(`./b8-day-${scene}.json`).then(r=>r.text()):JSON.stringify({version:scene==='old'?9:10,seed:1,day:0,log:scene==='old'?[{day:0,command:{type:'borrow',channel:'trust',amount:1000}}]:[]}),loaded=game.importSave(raw);if(!loaded.ok)throw Error(loaded.error);
function show(){const s=game.state;$('#status').textContent=`${headerDate(game.config,s)} · v${s.version} · 评级 ${game.config.finance.ratings[s.rating]} · 现金 ${(s.cash/10000).toFixed(6)}亿 · 指令 ${game.log.length} 条`;$('#finance').innerHTML=financePanel(game.config,s);$('#evidence').innerHTML=`<h2>债务合同与实际流水</h2><table><thead><tr><th>合同</th><th>本金（万元）</th><th>到期日</th><th>条款</th></tr></thead><tbody>${s.debts.map(d=>`<tr><td>${esc(d.id)} ${game.config.finance.channels[d.channel].name}</td><td>${d.principal.toFixed(2)}</td><td>第${d.maturityDay}日</td><td>${d.acceleration?`评级提前到期，原第${d.acceleration.originalMaturityDay}日`:d.covenant?'含评级条款':'原合同'}</td></tr>`).join('')}</tbody></table><p>累计实际偿还本金 ${s.reports.journal.filter(e=>e.kind==='repay').reduce((n,e)=>n-e.cash,0).toFixed(4)} 万元</p><p>${s.reports.decisions.filter(d=>d.text.includes('提前到期')).map(d=>esc(d.text)).join('<br>')}</p>`;}
game.onChange(show);const advance=n=>{const end=game.state.day+n;let frames=0;while(game.state.day<end&&game.state.status!=='bankrupt'&&frames++<1000){game.setSpeed(4);game.frame(250);game.frame(250);}game.setSpeed(0);};$('#day').onclick=()=>advance(1);$('#month').onclick=()=>advance(30);$('#finance').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;let r;if(b.dataset.act==='borrow-bond')r=issueBondFromForm(game,document);if(b.dataset.act==='extend')r=game.issue({type:'extend',debtId:b.dataset.id});if(b.dataset.act==='repay')r=game.issue({type:'repay',debtId:b.dataset.id});if(r)$('#notice').textContent=r.ok?'操作完成':r.error;};$('#reload').onclick=()=>{const r=game.importSave(game.exportSave());$('#notice').textContent=r.ok?'种子与指令重载成功':r.error;};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([game.exportSave()],{type:'application/json'}));a.download='b8-'+scene+'-save.json';a.click();URL.revokeObjectURL(a.href);};show();
</script></body></html>
