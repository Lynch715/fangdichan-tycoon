<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A6 山城特色地图验收</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#0f1419;color:#e8eaed;font:14px system-ui}header{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#182028;flex-shrink:0}h1{margin:0;font-size:17px}button{padding:7px;background:#293640;border:1px solid #64757d;border-radius:5px;color:inherit}#map{flex:1;min-height:0;touch-action:none}#status{color:#efb56b}footer{padding:4px 10px;font-size:12px;color:#a4b3bd;flex-shrink:0}@media(max-width:600px){h1{width:100%}}</style><header><h1>A6 山城特色地图验收</h1><button id="city">主城</button><button id="suburb">远郊</button><button id="fit">重置视角</button><button id="in">放大</button><button id="out">缩小</button><span id="status">加载中</span></header><div id="map"></div><footer>正式IsoMap只读回放存档；主城：两座跨江桥、索道、两组吊脚楼、山城步道。仅供本地验收。</footer><script type="module">
import{IsoMap}from'/src/render/isoMap.ts';import{validateSave,restore}from'/src/save.ts';
const $=s=>document.querySelector(s),map=new IsoMap($('#map'),()=>{});await map.init();const state=restore(validateSave(await fetch('./a4-garden-finished.json').then(r=>r.json())));let region='city';
function show(){map.update(state,null,region);$('#status').textContent=region==='city'?'主城 · 六处特色':'远郊 · 跨江桥复用';}
$('#city').addEventListener('click',()=>{region='city';show();map.fit()});$('#suburb').addEventListener('click',()=>{region='suburb';show();map.fit()});$('#fit').addEventListener('click',()=>map.fit());$('#in').addEventListener('click',()=>map.zoom(1.25));$('#out').addEventListener('click',()=>map.zoom(.8));show();
</script></html>
