<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B6 真实开发商验收</title><link rel="stylesheet" href="/src/style.css"><style>
body{height:100dvh;display:flex;flex-direction:column}header.qa{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px;background:var(--panel)}header.qa h1{font-size:17px;margin:0}#qa-status{padding:8px;font-size:13px}main.qa{flex:1;min-height:0;display:grid;grid-template-columns:1fr 440px}#map{min-height:0;overflow:hidden;touch-action:none}#panels{overflow:auto;padding:12px}#land,#companies{display:flex;flex-direction:column;gap:12px}#companies,#land,#finance{display:none}body[data-view=land] #land,body[data-view=companies] #companies,body[data-view=finance] #finance{display:flex;flex-direction:column;gap:12px}@media(max-width:600px){main.qa{grid-template-columns:1fr;grid-template-rows:180px 1fr}header.qa h1{width:100%}#panels{padding:8px}}
</style><body data-view="companies"><header class="qa"><h1>B6 真实开发商验收</h1><select id="qa-scene" aria-label="场景"><option value="1">报名与保证金</option><option value="60">真实拿地与开工</option><option value="3600">十年独立经营</option><option value="old">旧v6原地迁移</option><option value="before-default">同行违约前一天</option><option value="default">同行暴雷与收购</option><option value="negative">零对价保交楼</option><option value="downturn">下行期真实违约</option><option value="old7">旧v7原地迁移</option><option value="annual">六年真实排名</option><option value="annual-old7">旧v7六年历史排名</option><option value="annual-late">旧档第三年加入同行</option></select><button id="qa-next">推进一天</button><button data-view="companies">同行与项目</button><button id="qa-month">推进一月</button><button data-view="land">拍地</button><button data-view="finance">财务</button><button id="qa-report">项目结算</button><button id="qa-year">年报排名</button><button id="qa-export">导出测试档</button></header><div id="qa-status">加载中</div><main class="qa"><div id="map"></div><div id="panels"><div id="companies"></div><div id="land"></div><div id="finance"></div></div></main><dialog id="acquisition-dialog" class="acquisition-dialog" aria-labelledby="acquisition-title"></dialog><dialog id="reports-dialog" aria-labelledby="report-title"></dialog><script type="module">
import{Game}from'/src/game.ts';import{IsoMap}from'/src/render/isoMap.ts';import{headerDate,projectsPanel,auctionsPanel,financePanel}from'/src/ui/panels.ts';
import{AcquisitionController}from'/src/ui/acquisitionController.ts';
import{ReportController}from'/src/ui/reportController.ts';
const $=s=>document.querySelector(s);if(location.hostname!=='127.0.0.1'||location.port!=='5182')throw Error('仅供独立测试源5182使用');
const scene=new URLSearchParams(location.search).get('scene')??'1';if(!['1','60','3600','old','before-default','default','negative','downturn','old7','annual','annual-old7','annual-late'].includes(scene))throw Error('未知场景');$('#qa-scene').value=scene;$('#qa-scene').addEventListener('change',()=>location.search=new URLSearchParams({scene:$('#qa-scene').value}));
const preset={annual:{seed:7,day:2160},'annual-old7':{seed:7,day:2160},"before-default":{seed:7,day:1559},default:{seed:7,day:1560},negative:{seed:1,day:570},downturn:{seed:32,day:2190}}[scene]??{seed:7,day:Number(scene)};
const raw=scene==='old'?await fetch('./b5-cleared.json').then(r=>r.text()):scene==='old7'?await fetch('./b6b-main-after.json').then(r=>r.text()):scene==='annual-late'?JSON.stringify({...await fetch('./b6c-main-after.json').then(r=>r.json()),day:1080}):JSON.stringify({version:scene==='annual-old7'?7:8,...preset,log:[],revision:0});const game=new Game(),result=game.importSave(raw);if(!result.ok)throw Error(result.error);const controller=new ReportController(game,game.config,$('#reports-dialog')),acquisitionController=new AcquisitionController(game,$('#acquisition-dialog'),()=>{}),map=new IsoMap($('#map'),()=>{});await map.init();
function paint(selector,html){const el=$(selector),opened=[...el.querySelectorAll('details[open]')].map(e=>e.dataset.key);el.innerHTML=html;el.querySelectorAll('details').forEach(e=>{if(opened.includes(e.dataset.key))e.open=true;});}
function show(){const s=game.state;$('#qa-status').textContent=`${headerDate(game.config,s)} · 本公司现金 ${(s.cash/10000).toFixed(4)}亿 · 对手 ${s.rivals.length} 家 · 对手加入第${s.rivalsSinceDay}天 · 违约事件 ${s.industry.events.length} · 速度 ${game.speed}`;map.update(s,null);paint('#companies',projectsPanel(game.config,s,null));paint('#land',auctionsPanel(game.config,s,null));paint('#finance',financePanel(game.config,s));controller.sync();}
game.onChange(show);$('#qa-next').addEventListener('click',()=>{game.setSpeed(4);game.frame(250);game.frame(250);game.setSpeed(0)});document.querySelectorAll('button[data-view]').forEach(b=>b.addEventListener('click',()=>document.body.dataset.view=b.dataset.view));$('#qa-month').addEventListener('click',()=>{const target=game.state.day+30;let frames=0;while(game.state.day<target&&game.state.status!=='bankrupt'&&frames++<1000){game.setSpeed(4);game.frame(250);game.frame(250);}game.setSpeed(0);});
$('#companies').addEventListener('click',e=>{const b=e.target.closest('[data-act="acquire-project"]');if(b)acquisitionController.open(b.dataset.rival,b.dataset.id);});
$('#qa-report').addEventListener('click',()=>controller.open('projects'));$('#qa-year').addEventListener('click',()=>controller.open('year'));$('#qa-export').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([game.exportSave()],{type:'application/json'}));a.download='b6c-test-save.json';a.click();URL.revokeObjectURL(a.href);});show();
</script></body></html>
