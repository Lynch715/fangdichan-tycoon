<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B12 股权自救验收</title><link rel="stylesheet" href="/src/style.css"><style>body{height:100dvh;display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--panel)}header select{flex:0 1 200px;min-width:150px;max-width:100%}h1{font-size:17px;margin:0}#status,#notice{padding:8px;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 440px;flex:1;min-height:0}#map{overflow:hidden;touch-action:none}#panels{overflow:auto;padding:12px}#finance{display:flex;flex-direction:column;gap:14px}#evidence{overflow-wrap:anywhere;margin-top:16px}@media(max-width:600px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:100px 1fr}#panels{padding:8px}header h1{width:100%}}</style><body><header><h1>B12 股权自救验收</h1><select id="scene" aria-label="场景"><option value="pressure">近期到期压力</option><option value="deficit">现金缺口自救</option><option value="old">旧v13迁移</option></select><button id="month">推进一月</button><button id="original">推进至原还款月</button><button id="extended">推进至新还款月</button><button id="export">导出测试档</button><button id="reload">重载测试档</button></header><div id="status"></div><div id="notice" role="status"></div><main><div id="map"></div><div id="panels"><div id="finance"></div><details id="reports"><summary>本期报表</summary><div id="report-content"></div></details><section id="evidence" class="small"></section></div></main><dialog id="capital-dialog" class="acquisition-dialog" aria-labelledby="capital-title"></dialog><script type="module">
import{Game}from'/src/game.ts';import{CapitalController}from'/src/ui/capitalController.ts';import{IsoMap}from'/src/render/isoMap.ts';import{headerDate,financePanel}from'/src/ui/panels.ts';import{reportsPanel}from'/src/ui/reports.ts';import{restructuringQuote}from'/src/sim/capital.ts';
if(location.hostname!=='127.0.0.1'||location.port!=='5182')throw Error('仅供5182独立测试源使用');const $=s=>document.querySelector(s),scene=new URLSearchParams(location.search).get('scene')??'pressure';if(!['pressure','deficit','old'].includes(scene))throw Error('未知场景');$('#scene').value=scene;$('#scene').onchange=()=>location.search=new URLSearchParams({scene:$('#scene').value});const file=scene==='old'?'b11-tight-browser-save.json':'b12-'+scene+'.json',game=new Game(),result=game.importSave(await fetch('./'+file).then(r=>r.text()));if(!result.ok)throw Error(result.error);const originalDue=Math.max(game.state.day,...restructuringQuote(game.state,game.config).debts.map(d=>d.oldDay)),report=r=>$('#notice').textContent=r.ok?'操作完成':r.error,controller=new CapitalController(game,$('#capital-dialog'),report),map=new IsoMap($('#map'),()=>{});await map.init();
function paint(host,html){const states=new Map([...host.querySelectorAll('details')].map(d=>[d.dataset.key??'',d.open]));host.innerHTML=html;host.querySelectorAll('details').forEach(d=>{if(states.has(d.dataset.key??''))d.open=states.get(d.dataset.key??'');});}
function show(){const s=game.state;$('#status').textContent=`${headerDate(game.config,s)} · 第${s.day}日 · v${s.version} · 现金 ${(s.cash/10000).toFixed(6)}亿 · 指令${game.log.length}条 · ${s.status}`;map.update(s,null,'city');paint($('#finance'),financePanel(game.config,s,controller.selectedShare));$('#report-content').innerHTML=reportsPanel(game.config,s,'month');$('#evidence').textContent=`创始人 ${s.capital.founderShare}；战投 ${s.capital.strategicShare}；债权人 ${s.capital.creditorShare}；股权事件${s.capital.events.length}次；`+s.debts.map(d=>`${d.id} 本金${d.principal.toFixed(6)}万元 到期第${d.maturityDay}日`).join('；')+'；本期新增资本 '+s.reports.journal.filter(e=>e.kind==='equityInvestment').reduce((n,e)=>n+e.cash,0).toFixed(6)+'万元；4亿元还本流水 '+s.reports.journal.filter(e=>e.kind==='repay'&&e.amount===40000).map(e=>e.day).join(',');}
game.onChange(show);const advance=day=>{let frames=0;while(game.state.day<day&&game.state.status!=='bankrupt'&&frames++<100000){game.setSpeed(4);game.frame(250);game.frame(250);}game.setSpeed(0);};$('#month').onclick=()=>advance(game.state.day+30);$('#original').onclick=()=>advance(Math.ceil(originalDue/30)*30);$('#extended').onclick=()=>advance(Math.ceil((originalDue+game.config.capitalRescue.restructuring.extensionMonths*30)/30)*30);$('#finance').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.dataset.act==='strategic-investment')controller.open({type:'strategicInvestment',share:Number($('#capital-share').value)});if(b.dataset.act==='restructure-debt')controller.open({type:'restructureDebt'});};$('#reload').onclick=()=>report(game.importSave(game.exportSave()));$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([game.exportSave()],{type:'application/json'}));a.download='b12-'+scene+'-save.json';a.click();URL.revokeObjectURL(a.href);};show();
</script></body></html>
