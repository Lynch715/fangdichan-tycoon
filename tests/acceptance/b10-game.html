<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B10 监管处罚验收</title><link rel="stylesheet" href="/src/style.css"><style>body{height:100dvh;display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--panel)}header select{flex:0 1 180px;min-width:150px;max-width:100%}h1{font-size:17px;margin:0}#status,#notice{padding:8px;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 440px;flex:1;min-height:0}#map{overflow:hidden;touch-action:none}#panels{overflow:auto;padding:12px}#land,#projects{display:flex;flex-direction:column;gap:12px}body[data-view=land] #projects,body[data-view=projects] #land{display:none}@media(max-width:600px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:150px 1fr}#panels{padding:8px}header h1{width:100%}}</style><body data-view="projects"><header><h1>B10 监管处罚验收</h1><select id="scene" aria-label="场景"><option value="hoarding">捂盘撤证 · 待整改</option><option value="ban">借款拿地 · 禁拍</option><option value="old">旧v11项目</option></select><select id="region" aria-label="地图"><option value="outer">外围主城</option><option value="city">重庆主城</option><option value="suburb">远郊区县</option></select><button id="month">推进一月</button><button id="rectify">推进至整改期满</button><button data-view="land">拍地</button><button data-view="projects">项目</button><button id="export">导出测试档</button><button id="reload">重载测试档</button></header><div id="status"></div><div id="notice" role="status"></div><main><div id="map"></div><div id="panels"><div id="districts"></div><div id="land"></div><div id="projects"></div><section id="evidence" class="small"></section></div></main><script type="module">
import{Game}from'/src/game.ts';import{AuctionController}from'/src/ui/auctionController.ts';import{IsoMap}from'/src/render/isoMap.ts';import{headerDate,projectsPanel,auctionsPanel}from'/src/ui/panels.ts';import{districtsPanel}from'/src/ui/regions.ts';import{presaleBlocked}from'/src/sim/compliance.ts';
if(location.hostname!=='127.0.0.1'||location.port!=='5182')throw Error('仅供5182独立测试源使用');const $=s=>document.querySelector(s),scene=new URLSearchParams(location.search).get('scene')??'hoarding';if(!['hoarding','ban','old'].includes(scene))throw Error('未知场景');$('#scene').value=scene;$('#scene').onchange=()=>location.search=new URLSearchParams({scene:$('#scene').value});const file=scene==='hoarding'?'b10-hoarding.json':scene==='ban'?'b10-banned-auctions.json':'b9-project-browser-save.json',game=new Game(),result=game.importSave(await fetch('./'+file).then(r=>r.text()));if(!result.ok)throw Error(result.error);let mapId=scene==='hoarding'?'suburb':'outer';$('#region').value=mapId;document.body.dataset.view=scene==='ban'?'land':'projects';const report=r=>$('#notice').textContent=r.ok?'操作完成':r.error,controller=new AuctionController(game,document,report),map=new IsoMap($('#map'),()=>{});await map.init();
function paint(host,html){const states=new Map([...host.querySelectorAll('details')].map(d=>[d.dataset.key??'',d.open]));host.innerHTML=html;host.querySelectorAll('details').forEach(d=>{if(states.has(d.dataset.key??''))d.open=states.get(d.dataset.key??'');});}
function show(){const s=game.state;$('#status').textContent=`${headerDate(game.config,s)} · 第${s.day}日 · v${s.version} · 现金 ${(s.cash/10000).toFixed(6)}亿 · 指令${game.log.length}条`;map.update(s,null,mapId);paint($('#districts'),districtsPanel(game.config,s,mapId));paint($('#land'),auctionsPanel(game.config,{...s,auctions:s.auctions.filter(a=>game.config.districts.find(d=>d.id===a.districtId).mapId===mapId)},null,controller.bids,controller.amenities));paint($('#projects'),projectsPanel(game.config,s,null));$('#evidence').textContent=`未使用借款 ${s.compliance.borrowedCash.toFixed(6)}万元；罚款流水 ${s.reports.journal.filter(e=>e.kind==='fine').reduce((n,e)=>n+e.amount,0).toFixed(6)}万元；`+s.projects.filter(p=>p.presale||scene==='old').map(p=>`${p.id} 已售 ${p.soldArea.toFixed(6)}㎡，${presaleBlocked(p)?'预售撤证':p.presale?'可预售':'原项目无新处罚'}`).join('；');}
game.onChange(show);$('#region').onchange=()=>{mapId=$('#region').value;show();};document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>document.body.dataset.view=b.dataset.view);const advance=day=>{let frames=0;while(game.state.day<day&&game.state.status!=='bankrupt'&&frames++<10000){game.setSpeed(4);game.frame(250);game.frame(250);}game.setSpeed(0);};$('#month').onclick=()=>advance(game.state.day+30);$('#rectify').onclick=()=>advance(Math.max(game.state.day,...game.state.projects.map(p=>p.presale?.reapplyDay??0)));$('#projects').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const p=game.state.projects.find(p=>p.id===b.dataset.id);if(b.dataset.act==='price')report(game.issue({type:'setPrice',projectId:p.id,priceFactor:p.priceFactor+Number(b.dataset.delta)}));if(b.dataset.act==='file')report(game.issue({type:'filePrice',projectId:p.id}));};$('#reload').onclick=()=>report(game.importSave(game.exportSave()));$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([game.exportSave()],{type:'application/json'}));a.download='b10-'+scene+'-save.json';a.click();URL.revokeObjectURL(a.href);};show();
</script></body></html>
