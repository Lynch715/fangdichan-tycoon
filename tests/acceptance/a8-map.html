<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A8 图集密度与失败回退验收</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#0f1419;color:#e8eaed;font:14px system-ui}header{padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#182028;flex-shrink:0}h1{margin:0;font-size:17px}select,button{padding:7px;background:#293640;border:1px solid #64757d;border-radius:5px;color:inherit}#map{flex:1;min-height:0;touch-action:none}#status{color:#efb56b}footer{padding:4px 10px;font-size:11px;color:#a4b3bd;flex-shrink:0}details{max-height:100px;overflow:auto}pre{white-space:pre-wrap;margin:0}@media(max-width:600px){h1{width:100%}}</style><header><h1>A8 图集密度与失败回退验收</h1><label>加载 <select id="mode"><option value="auto">屏幕密度</option><option value="1x">强制@1x</option><option value="2x">强制@2x</option><option value="none">清单404</option><option value="json-0">JSON页0失败</option><option value="json-1">JSON页1失败</option><option value="json-2">JSON页2失败</option><option value="png-0">PNG页0失败</option><option value="png-1">PNG页1失败</option><option value="png-2">PNG页2失败</option></select></label><label>场景 <select id="scene"><option value="city-finished">主城成品</option><option value="tower-frame">高层施工</option><option value="garden-frame">洋房施工</option><option value="suburb">远郊成品</option></select></label><button id="fit">重置视角</button><button id="out">缩小</button><span id="status">加载中</span></header><div id="map"></div><footer>真实图集加载器与正式IsoMap；读取合法种子/指令日志。失败夹具仅用于本地验收。<details><summary>请求资源证据</summary><pre id="resources"></pre></details></footer><script type="module">
import{IsoMap}from'/src/render/isoMap.ts';import{loadArt}from'/src/render/art.ts';import{validateSave,restore}from'/src/save.ts';
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),mode=params.get('mode')??'auto',scene=params.get('scene')??'city-finished';$('#mode').value=mode;$('#scene').value=scene;
function navigate(){location.search=new URLSearchParams({mode:$('#mode').value,scene:$('#scene').value}).toString()};$('#mode').addEventListener('change',navigate);$('#scene').addEventListener('change',navigate);
const path=scene==='suburb'?'a7-suburb-1500.json':scene==='tower-frame'?'a4-tower-frame.json':scene==='garden-frame'?'a4-garden-frame.json':'a4-garden-finished.json',state=restore(validateSave(await fetch('./'+path).then(r=>r.json()))),map=new IsoMap($('#map'),()=>{});let count=0;
const density=mode==='auto'||mode==='none'?devicePixelRatio:mode==='1x'?1:2,root=mode==='none'?'./art-missing/':mode.startsWith('json-')||mode.startsWith('png-')?'./a8-'+mode+'/':'/art/';
await map.init(async()=>{const textures=await loadArt(density,root);count=Object.keys(textures).length;return textures});map.update(state,null,scene==='suburb'?'suburb':'city');$('#status').textContent='DPR '+devicePixelRatio+' / 请求@'+(density>1?2:1)+'x / 贴图 '+count;
$('#resources').textContent=performance.getEntriesByType('resource').filter(r=>/atlas|broken|missing-image/.test(r.name)).map(r=>new URL(r.name).pathname).join('\n');$('#fit').addEventListener('click',()=>map.fit());$('#out').addEventListener('click',()=>map.zoom(.8));
</script></html>
