<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B7 拍地与配建验收</title><link rel="stylesheet" href="/src/style.css"><style>
body{height:100dvh;display:flex;flex-direction:column}header{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--panel)}h1{font-size:17px;margin:0}#status,#notice{padding:8px;font-size:13px}main{display:grid;grid-template-columns:1fr 440px;flex:1;min-height:0}#map{overflow:hidden;touch-action:none}#panels{overflow:auto;padding:12px}#land,#projects{display:flex;flex-direction:column;gap:12px}body[data-view=land] #projects,body[data-view=projects] #land{display:none}@media(max-width:600px){main{grid-template-columns:1fr;grid-template-rows:160px 1fr}#panels{padding:8px}header h1{width:100%}}
</style><body data-view="land"><header><h1>B7 拍地与配建验收</h1><select id="scene" aria-label="场景"><option value="amenity">竞配建 · 学校</option><option value="lottery">摇号 · 保障房</option><option value="old">旧v8待拍地块</option></select><button id="advance">推进至开拍</button><button data-view="land">拍地</button><button data-view="projects">项目</button><button id="export">导出测试档</button><button id="reload">重载测试档</button></header><div id="status"></div><div id="notice" role="status"></div><main><div id="map"></div><div id="panels"><div id="land"></div><div id="projects"></div></div></main><script type="module">
import{Game}from'/src/game.ts';import{AuctionController}from'/src/ui/auctionController.ts';import{IsoMap}from'/src/render/isoMap.ts';import{headerDate,projectsPanel,auctionsPanel}from'/src/ui/panels.ts';
if(location.hostname!=='127.0.0.1'||location.port!=='5182')throw Error('仅供独立测试源5182使用');
const $=s=>document.querySelector(s),scene=new URLSearchParams(location.search).get('scene')??'amenity';if(!['amenity','lottery','old'].includes(scene))throw Error('未知场景');$('#scene').value=scene;$('#scene').onchange=()=>location.search=new URLSearchParams({scene:$('#scene').value});
const game=new Game(),raw=scene==='amenity'?{version:9,seed:1,day:811,log:[]}:scene==='lottery'?{version:9,seed:2,day:1261,log:[]}:{version:8,seed:7,day:0,log:[]},result=game.importSave(JSON.stringify(raw));if(!result.ok)throw Error(result.error);const targetId=scene==='amenity'?'L37':scene==='lottery'?'L62':'L1',end=game.state.auctions.find(a=>a.id===targetId).endDay;
const controller=new AuctionController(game,document,r=>$('#notice').textContent=r.ok?'报价已提交':r.error),map=new IsoMap($('#map'),()=>{});await map.init();
function show(){const s=game.state;$('#status').textContent=`${headerDate(game.config,s)} · v${s.version} · 本公司现金 ${(s.cash/10000).toFixed(4)}亿 · 指令 ${game.log.length} 条`;map.update(s,null,scene==='old'?'city':'suburb');$('#land').innerHTML=auctionsPanel(game.config,{...s,auctions:s.auctions.filter(a=>a.id===targetId)},null,controller.bids,controller.amenities);$('#projects').innerHTML=projectsPanel(game.config,s,null);}
game.onChange(show);document.querySelectorAll('[data-view]').forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>document.body.dataset.view=b.dataset.view;});$('#advance').onclick=()=>{let frames=0;while(game.state.day<end&&game.state.status!=='bankrupt'&&frames++<2000){game.setSpeed(4);game.frame(250);game.frame(250);}game.setSpeed(0);$('#notice').textContent=game.state.news.filter(n=>n.text.includes(targetId)).map(n=>n.text).join('；');document.body.dataset.view='projects';};$('#reload').onclick=()=>{const result=game.importSave(game.exportSave());$('#notice').textContent=result.ok?'重载完成，种子与指令已重建':result.error;};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([game.exportSave()],{type:'application/json'}));a.download='b7-'+scene+'-save.json';a.click();URL.revokeObjectURL(a.href);};show();
</script></body></html>
