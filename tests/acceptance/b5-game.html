<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B5 结算与报表验收</title><link rel="stylesheet" href="/src/style.css"><style>
body{height:100dvh;display:flex;flex-direction:column}header.qa{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px;background:var(--panel)}h1{font-size:17px;margin:0}header.qa select{max-width:260px}#map{flex:1;min-height:0;overflow:hidden;touch-action:none}#qa-status{padding:10px 14px;font-size:13px;color:var(--orange-text)}footer.qa{font-size:11px;padding:4px 12px;color:var(--muted)}@media(max-width:600px){h1{width:100%}header.qa{padding:8px}header.qa button{padding:0 9px;font-size:12px}}
</style><header class="qa"><h1>B5 结算与报表验收</h1><select id="qa-scene" aria-label="场景"><option value="before-cleared">清盘前一天</option><option value="cleared">完整项目与三年报表</option><option value="before-bankrupt">破产前一天</option><option value="bankrupt">破产复盘</option><option value="old">旧档历史回溯</option><option value="old-cleared">旧清盘项目回溯结算</option><option value="long">旧档30年与362个项目</option></select><button id="qa-next">推进一天</button><button data-open="month">月报</button><button data-open="year">年报</button><button data-open="projects">项目结算</button><button data-open="review">经营复盘</button></header><div id="qa-status">加载中</div><div id="map"></div><footer class="qa">默认配置、真实种子和指令日志；正式Game、ReportController与IsoMap。请在独立5182端口测试源使用，不覆盖127.0.0.1或localhost试玩存档。</footer><dialog id="reports-dialog" aria-labelledby="report-title"></dialog><script type="module">
import{Game}from'/src/game.ts';import{ReportController}from'/src/ui/reportController.ts';import{IsoMap}from'/src/render/isoMap.ts';import{headerDate}from'/src/ui/panels.ts';
const $=s=>document.querySelector(s),scene=new URLSearchParams(location.search).get('scene')??'before-cleared';$('#qa-scene').value=scene;$('#qa-scene').addEventListener('change',()=>location.search=new URLSearchParams({scene:$('#qa-scene').value}));
if(location.hostname!=='127.0.0.1'||location.port!=='5182')throw Error('请使用独立测试源127.0.0.1:5182，避免覆盖试玩档');
const game=new Game(),r=game.importSave(await fetch(scene==='long'?'./b5e-v5-long.json':'./b5-'+scene+'.json').then(r=>r.text()));if(!r.ok)throw Error(r.error);const controller=new ReportController(game,game.config,$('#reports-dialog')),map=new IsoMap($('#map'),()=>{});await map.init();
function show(){const s=game.state;$('#qa-status').textContent=`${headerDate(game.config,s)} · ${s.status} · 现金 ${(s.cash/10000).toFixed(4)}亿 · 完结月报 ${s.reports.months.length} · 流水 ${s.reports.journal.length} · 项目 ${s.projects[0]?.stage??'无'} · 速度 ${game.speed}`;map.update(s,null);controller.sync();}
game.onChange(show);$('#qa-next').addEventListener('click',()=>{game.setSpeed(4);game.frame(250);game.frame(250)});document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>controller.open(b.dataset.open)));show();
</script></html>
