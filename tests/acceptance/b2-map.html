<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B2 停工与接管验收</title><link rel="stylesheet" href="/src/style.css"><style>
body{display:flex;flex-direction:column;height:100dvh}header{padding:10px 16px;background:var(--panel);display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}header select,header button{padding:6px}#layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}#map{min-width:0;min-height:0;overflow:hidden;touch-action:none}aside{min-width:0;padding:12px;overflow:auto;background:var(--panel);border-left:1px solid var(--line)}#status{color:var(--orange-text);font-size:13px}#ledger{font-size:12px;line-height:1.6}footer{font-size:11px;padding:4px 12px;color:var(--muted)}@media(max-width:600px){header{padding:8px;gap:6px}h1{width:100%}#layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(240px,1fr) minmax(280px,1fr)}aside{border-left:0;border-top:1px solid var(--line)}}
</style><header><h1>B2 停工与接管验收</h1><select id="scene" aria-label="场景"><option value="stopped-5">连续停工5个月</option><option value="takeover-6">第6个月政府接管</option><option value="resumed">第5个月借款复工</option></select><button id="fit">重置视角</button><button id="next">推进一个月</button><button id="rescue">开发贷补资1亿</button><span id="status">加载中</span></header><div id="layout"><div id="map"></div><aside><div id="ledger"></div><div id="projects" class="stack"></div></aside></div><footer>默认生产参数、种子8与真实指令日志；正式项目面板和IsoMap。独立验收页，不读取或修改玩家存档。</footer><script type="module">
import{IsoMap}from'/src/render/isoMap.ts';import{restore,validateSave}from'/src/save.ts';import{applyCommand,stepDay,defaultConfig,computeMetrics}from'/src/sim/index.ts';import{projectsPanel,headerDate}from'/src/ui/panels.ts';
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),scene=params.get('scene')??'stopped-5';$('#scene').value=scene;$('#scene').addEventListener('change',()=>location.search=new URLSearchParams({scene:$('#scene').value}));
const saved=validateSave(await fetch('./b2-'+scene+'.json').then(r=>r.json())),state=restore(saved),map=new IsoMap($('#map'),()=>{});await map.init();let message='';
function show(){const p=state.projects[0],m=computeMetrics(state);map.update(state,p.id);$('#projects').innerHTML=projectsPanel(defaultConfig,state,p.id);$('#status').textContent=headerDate(defaultConfig,state)+' · '+message;$('#ledger').textContent=`现金 ${(state.cash/10000).toFixed(4)}亿 · 关注度 ${state.attention} · 工程 ${(p.progress*100).toFixed(2)}% · 存货 ${(m.inventory/10000).toFixed(2)}亿 · 监管款 ${(m.escrow/10000).toFixed(2)}亿 · 欠付地价 ${(m.landPayable/10000).toFixed(2)}亿`;$('#rescue').disabled=p.stage!=='construction';}
$('#fit').addEventListener('click',()=>map.fit());$('#next').addEventListener('click',()=>{const end=state.day+30;while(state.day<end&&state.status!=='bankrupt')stepDay(state);message=state.news[0]?.text??'';show()});$('#rescue').addEventListener('click',()=>{const cmd={type:'borrow',channel:'devLoan',projectId:state.projects[0].id,amount:10000},r=applyCommand(state,cmd);if(r.ok)saved.log.push({day:state.day,command:cmd});message=r.ok?'补资到账；月末检查复工':r.error;show()});
$('#projects').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const p=state.projects[0],act=b.dataset.act;let cmd;if(act==='pace')cmd={type:'setPace',projectId:p.id,pace:b.dataset.pace};if(act==='paper')cmd={type:'setPaper',projectId:p.id,enabled:!p.paperRatio};if(act==='cooperate')cmd={type:'cooperate',projectId:p.id};if(act==='file')cmd={type:'filePrice',projectId:p.id};if(act==='sell')cmd={type:'sellProject',projectId:p.id};if(act==='appearance')cmd={type:'setAppearance',projectId:p.id,product:$('#appearance-product-'+p.id).value,variant:$('#appearance-variant-'+p.id).value};if(!cmd)return;const r=applyCommand(state,cmd);message=r.ok?'操作成功':r.error;show()});show();
</script></html>
